<!DOCTYPE html>
<html lang="bg" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Работно време — Каса</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body{ height:100%; }
  body{ background:var(--ink); }
  #app{ max-width:720px; margin:0 auto; padding:24px 16px; min-height:100vh; display:flex; flex-direction:column; }
  #app h1{ color:var(--paper); text-align:center; margin-bottom:8px; }
  #root{ flex:1; display:flex; flex-direction:column; }
  #root.center-content{ justify-content:center; }
  .kiosk-btn{
    display:block; width:100%; padding:22px; margin-bottom:12px;
    background:#fff; border:1px solid var(--line); border-radius:16px;
    font-size:22px; font-weight:700; color:var(--ink); text-align:center; cursor:pointer;
  }
  .kiosk-btn:active{ background:var(--paper-2); }
  video, canvas{ width:100%; border-radius:16px; background:#000; }
  .kiosk-primary-btn{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    width:100%; aspect-ratio:1.15; max-height:52vh;
    background:var(--ink); color:#fff; border:none; border-radius:24px;
    font-size:30px; font-weight:800; text-align:center; cursor:pointer;
  }
  .kiosk-primary-btn:active{ background:var(--ink-2); }
  .kiosk-caption{ color:var(--paper); opacity:.75; text-align:center; font-size:14px; margin-top:16px; line-height:1.6; max-width:440px; margin-left:auto; margin-right:auto; }
  .kiosk-footer-bar{
    margin-top:auto; padding-top:24px; text-align:center;
  }
  .kiosk-footer-link{
    background:transparent; border:1px solid rgba(255,255,255,.25); color:rgba(255,255,255,.75);
    border-radius:100px; padding:10px 18px; font-size:13px; cursor:pointer;
  }
  .kiosk-footer-link:active{ background:rgba(255,255,255,.1); }
  .kiosk-back-btn{
    background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.3);
    border-radius:10px; padding:8px 16px; font-size:14px; cursor:pointer;
  }
  .kiosk-back-btn:active{ background:rgba(255,255,255,.22); }
  .picker-tile{
    background:#fff; border:1px solid var(--line); border-radius:12px;
    padding:8px; cursor:pointer; text-align:center;
  }
  .picker-tile img{ width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; margin-bottom:6px; }
  .picker-tile .pname{ font-size:15px; font-weight:700; color:var(--ink); }
</style>
</head>
<body>
<div id="app">
  <h1 style="font-size:34px;">Работно време</h1>
  <div id="root"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app-kiosk.js?v=5"></script>
</body>
</html>
