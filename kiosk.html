<!DOCTYPE html>
<html lang="bg" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Работно време — Каса</title>
<link rel="stylesheet" href="style.css">
<style>
  /* Picker grid tiles reuse the same card look as the rest of the app */
  .picker-tile{
    background:#fff; border:1px solid var(--line); border-radius:12px;
    padding:8px; cursor:pointer; text-align:center;
  }
  .picker-tile img{ width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; margin-bottom:6px; }
  .picker-tile .pname{ font-size:15px; font-weight:700; color:var(--ink); }
  video, canvas{ width:100%; border-radius:16px; background:#000; }
</style>
</head>
<body>
<div class="screen" id="app">
  <div class="center" style="margin:30px 0 20px;">
    <h1 style="font-size:38px;">Работно време</h1>
  </div>
  <div id="root"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app-kiosk.js?v=7"></script>
</body>
</html>
